<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 140" fill="none">
  <!-- Entire content group, centered as a whole -->
  <g transform="translate(118,28)">
    <!-- Magnifying glass icon -->
    <circle cx="26" cy="30" r="24" stroke="#222" stroke-width="5.5" fill="none"/>
    <line x1="43" y1="47" x2="59" y2="63" stroke="#222" stroke-width="5.5" stroke-linecap="round"/>
    <!-- "Open Spotlight Bar" lettering -->
    <text x="72" y="42" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-1" fill="#222">Open Spotlight Bar</text>
    <!-- Subtle tagline -->
    <text x="74" y="72" font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif" font-size="15" font-weight="400" letter-spacing="0.5" fill="#666">keyboard-first, cross-platform desktop launcher</text>
    <!-- Decorative search bar underline -->
    <rect x="72" y="82" width="380" height="3" rx="1.5" fill="#222" opacity="0.15"/>
  </g>
</svg>
